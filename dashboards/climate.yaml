      - grid-template-rows: 30px auto
      icon:
      - width: 23px
      - color: '#169d91'
      name:
      - justify-self: start
      - font-weight: '600'
      - font-size: 16px
      state:
      - font-size: 25px
      - font-weight: '500'
      label:
      - justify-self: start
      - text-align: left
