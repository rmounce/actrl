- type: grid
  cards:
  - type: heading
    heading: History · 6h
    icon: mdi:chart-line
  - type: vertical-stack
    cards:
    - type: conditional
      conditions:
      - entity: input_boolean.ac_use_feels_like
        state: 'on'
      card:
        type: custom:apexcharts-card
        header:
          show: true
          title: Room temperatures · feels like
          show_states: false
        graph_span: 6h
        update_interval: 60s
        all_series_config:
          group_by:
            func: avg
            duration: 2min
          stroke_width: 2
          fill_raw: 'null'
        apex_config:
          chart:
            height: 175
            animations:
              enabled: false
            toolbar:
              show: false
          stroke:
            curve: straight
          legend:
            position: bottom
          tooltip:
            x:
              format: HH:mm
          xaxis:
            labels:
              datetimeUTC: false
        series:
        - entity: sensor.kitchen_feels_like
          name: Living / kitchen
          color: '#169d91'
        - entity: sensor.study_feels_like
          name: Study
          color: '#5986da'
        - entity: sensor.bed_1_feels_like
          name: Bedroom 1
          color: '#ba80cc'
        - entity: sensor.bed_2_feels_like
          name: Bedroom 2
          color: '#d19b38'
        - entity: sensor.bed_3_feels_like
          name: Bedroom 3
          color: '#df7978'
        card_mod:
          style: 'ha-card { border-radius: 10px; box-shadow: none; }

            .card-content { padding: 8px 12px !important; }

            .card-content > div { margin: 0 !important; }

            .card-header { padding: 10px 12px 0 !important; font-size: 16px !important; }

            ha-card { --mdc-list-item-one-line-height: 40px; }

            '
    - type: conditional
      conditions:
      - entity: input_boolean.ac_use_feels_like
        state: 'off'
      card:
        type: custom:apexcharts-card
        header:
          show: true
          title: Room temperatures · measured
          show_states: false
        graph_span: 6h
        update_interval: 60s
        all_series_config:
          group_by:
            func: avg
            duration: 2min
          stroke_width: 2
          fill_raw: 'null'
        apex_config:
          chart:
            height: 175
            animations:
              enabled: false
