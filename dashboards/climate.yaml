title: Climate
path: climate-prototype
icon: mdi:home-thermometer-outline
type: sections
max_columns: 3
dense_section_placement: true
sections:
- type: grid
  cards:
  - type: heading
    heading: System
    icon: mdi:home-thermometer-outline
  - type: markdown
    content: '{% set s = states(''sensor.actrl_status'') %}

      {% set age = as_timestamp(now()) - (state_attr(''sensor.actrl_status'',''heartbeat'') | float(0)) %}

      {% set names = {''bed_1'':''Bedroom 1'',''bed_2'':''Bedroom 2'',''bed_3'':''Bedroom 3'',''kitchen'':''Living
      / kitchen'',''study'':''Study''} %}

      {% set lead = state_attr(''sensor.actrl_status'',''lead_room'') %}

      **{{ ''Status overdue'' if age > 90 else s | title }}**{% if age > 90 %} · Heartbeat >90s{% endif %}

      {% if age <= 90 and s in [''idle'',''heating'',''cooling''] %}


      {{ names.get(lead, lead) }} · {{ state_attr(''sensor.actrl_status'',''lead_temperature'') | round(1, default=0)
      }}° → {{ state_attr(''sensor.actrl_status'',''lead_target'') | round(1, default=0) }}° · [Diagnostics](/dashboard-advanced/weather)

      {% endif %}'
    card_mod:
      style: 'ha-card { border-radius: 10px; box-shadow: none; }

        .card-content { padding: 8px 12px !important; }

        .card-content > div { margin: 0 !important; }

        .card-header { padding: 10px 12px 0 !important; font-size: 16px !important; }

        ha-card { --mdc-list-item-one-line-height: 40px; }

        '
  - type: entities
    show_header_toggle: false
    entities:
    - type: attribute
      entity: climate.m5atom_climate
      attribute: hvac_action
      name: Unit activity
    - type: attribute
      entity: climate.m5atom_climate
      attribute: fan_mode
      name: Reported fan speed
    - entity: binary_sensor.m5atom_compressor
      name: Compressor running
    - entity: binary_sensor.m5atom_m5atom_defrost
      name: Defrost reported
    - entity: sensor.m5atom_outside_temp
      name: Outside at unit
    - entity: input_number.aircon_comp_speed
      name: Capacity step · estimated
      type: simple-entity
    - entity: sensor.shellyem_ec64c9c6932b_channel_1_power
      name: Outdoor power
    - entity: sensor.shellyem_ec64c9c6932b_channel_2_power
      name: Indoor power
    card_mod:
      style: 'ha-card { border-radius: 10px; box-shadow: none; }

        .card-content { padding: 8px 12px !important; }

        .card-content > div { margin: 0 !important; }

        .card-header { padding: 10px 12px 0 !important; font-size: 16px !important; }

        ha-card { --mdc-list-item-one-line-height: 40px; }

        '
  - type: heading
    heading: Demand & airflow
    icon: mdi:air-filter
  - type: markdown
    content: '### Controller signals


      | Signal | Value |

      | :-- | --: |

      | Worst-room demand | {{ (states(''input_number.aircon_weighted_error'') | float | round(2)) if is_number(states(''input_number.aircon_weighted_error''))
      else ''—'' }} K |

      | Temperature trend | {{ (states(''input_number.aircon_avg_deriv'') | float | round(2)) if is_number(states(''input_number.aircon_avg_deriv''))
      else ''—'' }} K |

      | Capacity integral | {{ (states(''input_number.aircon_meta_integral'') | float | round(2)) if is_number(states(''input_number.aircon_meta_integral''))
      else ''—'' }} K |

      | Solar target offset | {{ (states(''input_number.grid_surplus_integral'') | float | round(2)) if is_number(states(''input_number.grid_surplus_integral''))
      else ''—'' }} K |

      | Follow-me temperature | {{ (states(''input_number.fake_temperature'') | float | round(2)) if is_number(states(''input_number.fake_temperature''))
      else ''—'' }} °C |

      '
    card_mod:
      style: 'ha-card { border-radius: 10px; box-shadow: none; }

        .card-content { padding: 8px 12px !important; }

        .card-content > div { margin: 0 !important; }

        .card-header { padding: 10px 12px 0 !important; font-size: 16px !important; }

        ha-card { --mdc-list-item-one-line-height: 40px; }

        '
  - type: entities
    title: Air path
    show_header_toggle: false
    entities:
    - entity: number.m5atom_static_pressure
      name: Static pressure setting
      type: simple-entity
    - entity: sensor.m5atom_inside_temp
      name: Return temperature
    - entity: sensor.m5atom_inside_coil_inlet_temp
      name: Indoor coil
    - entity: sensor.m5atom_outside_coil_temp
      name: Outdoor coil
    card_mod:
      style: 'ha-card { border-radius: 10px; box-shadow: none; }

        .card-content { padding: 8px 12px !important; }

        .card-content > div { margin: 0 !important; }

        .card-header { padding: 10px 12px 0 !important; font-size: 16px !important; }

        ha-card { --mdc-list-item-one-line-height: 40px; }

        '
- type: grid
  cards:
  - type: heading
    heading: Rooms
    icon: mdi:floor-plan
  - type: custom:button-card
    entity: climate.kitchen_aircon
    name: Living / kitchen
    icon: mdi:sofa-outline
    show_state: true
    show_label: true
    state_display: '[[[ const feels = states[''input_boolean.ac_use_feels_like'']?.state === ''on''; const v = states[''sensor.kitchen_''
      + (feels ? ''feels_like'' : ''average_temperature'')]?.state; return v != null && v !== '''' && Number.isFinite(Number(v))
      ? Number(v).toFixed(1) + ''°'' : ''—''; ]]]'
    label: '[[[

      const r = "kitchen";

      const val = (id) => states[id]?.state;

      const num = (v) => v !== null && v !== undefined && v !== '''' && Number.isFinite(Number(v)) ? Number(v).toFixed(1)
      : ''—'';

      const a = entity?.attributes || {};

      const manual = val(`input_boolean.${r}_manual_ac`) === ''on'';

      const window = val(`binary_sensor.${r}_window`) === ''on'';

      const turbo = val(`timer.${r}_timed_turbo`) === ''active'';

      const active = val(`timer.${r}_timed_active`) === ''active'';

      const status = entity?.state === ''off'' ? ''Room off'' : manual ? ''Manual'' : window ? ''Window open'' :
      turbo ? ''Turbo'' : active ? ''Timed'' : ''Schedule'';

      const feels = val(''input_boolean.ac_use_feels_like'') === ''on'';


      return `${status} · ${num(a.target_temp_low)}–${num(a.target_temp_high)}° target<br>${feels ? ''Feels like''
      : ''Measured''} · Damper ${val(`sensor.${r}_damper`) ?? ''—''}%`;

      ]]]'
    triggers_update:
    - sensor.kitchen_average_temperature
    - sensor.kitchen_feels_like
    - sensor.kitchen_damper
    - binary_sensor.kitchen_window
    - input_boolean.kitchen_manual_ac
    - timer.kitchen_timed_active
    - timer.kitchen_timed_turbo
    - input_boolean.ac_use_feels_like
    tap_action:
      action: more-info
    hold_action:
      action: none
    styles:
      card:
      - border-radius: 10px
      - padding: 10px 12px
      - box-shadow: none
      - border-left: '4px solid #169d91'
      grid:
      - grid-template-areas: '"i n s" "l l l"'
