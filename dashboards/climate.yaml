- type: grid
  cards:
  - type: heading
    heading: The last six hours
    icon: mdi:chart-line
  - type: vertical-stack
    cards:
    - type: custom:apexcharts-card
      header:
        show: true
        title: Room temperatures · measured
        show_states: false
      graph_span: 6h
      update_interval: 60s
      all_series_config:
        group_by:
          func: avg
          duration: 2min
        stroke_width: 2
        fill_raw: 'null'
      apex_config:
        chart:
          height: 215
          animations:
            enabled: false
          toolbar:
            show: false
        stroke:
          curve: straight
        legend:
          position: bottom
        tooltip:
          x:
            format: HH:mm
        xaxis:
          labels:
            datetimeUTC: false
      series:
      - entity: sensor.kitchen_average_temperature
        name: Living / kitchen
        color: '#169d91'
      - entity: sensor.study_average_temperature
        name: Study
        color: '#5986da'
      - entity: sensor.bed_1_average_temperature
        name: Bedroom 1
        color: '#ba80cc'
      - entity: sensor.bed_2_average_temperature
        name: Bedroom 2
        color: '#d19b38'
      - entity: sensor.bed_3_average_temperature
        name: Bedroom 3
        color: '#df7978'
      card_mod: *id001
  - type: vertical-stack
    cards:
    - type: custom:apexcharts-card
      header:
        show: true
        title: Electrical power
        show_states: false
      graph_span: 6h
      update_interval: 60s
      all_series_config:
        group_by:
          func: avg
          duration: 2min
        stroke_width: 2
        fill_raw: 'null'
      apex_config:
        chart:
          height: 215
          animations:
            enabled: false
          toolbar:
            show: false
        stroke:
          curve: straight
        legend:
          position: bottom
        tooltip:
          x:
            format: HH:mm
        xaxis:
          labels:
            datetimeUTC: false
      series:
      - entity: sensor.shellyem_ec64c9c6932b_channel_1_power
        name: Outdoor
        color: '#169d91'
      - entity: sensor.shellyem_ec64c9c6932b_channel_2_power
        name: Indoor
        color: '#d19b38'
      card_mod: *id001
  - type: vertical-stack
    cards:
    - type: custom:apexcharts-card
      header:
        show: true
        title: Damper positions
        show_states: false
      graph_span: 6h
      update_interval: 60s
      all_series_config:
        group_by:
          func: avg
          duration: 2min
        stroke_width: 2
        fill_raw: 'null'
      apex_config:
        chart:
          height: 215
          animations:
            enabled: false
          toolbar:
            show: false
        stroke:
          curve: straight
        legend:
          position: bottom
        tooltip:
          x:
            format: HH:mm
        xaxis:
          labels:
            datetimeUTC: false
      series:
      - entity: sensor.kitchen_damper
        name: Living / kitchen
        color: '#169d91'
      - entity: sensor.study_damper
        name: Study
        color: '#5986da'
      - entity: sensor.bed_1_damper
        name: Bedroom 1
        color: '#ba80cc'
      - entity: sensor.bed_2_damper
        name: Bedroom 2
        color: '#d19b38'
      - entity: sensor.bed_3_damper
        name: Bedroom 3
        color: '#df7978'
      card_mod: *id001
- type: grid
  cards:
  - type: heading
    heading: Control preferences
    icon: mdi:tune
  - type: entities
    title: Automatic control
    show_header_toggle: false
    entities:
    - entity: input_boolean.ac_use_feels_like
      name: Use feels-like temperature
    - entity: input_boolean.ac_use_grid_surplus_cool
      name: Solar surplus · extra cooling
    - entity: input_boolean.ac_use_grid_surplus_heat
      name: Solar surplus · extra heating
    - entity: input_boolean.ac_min_power
      name: Minimum-power mode
    - entity: input_boolean.ac_manual_mode
      name: Pause actrl · manual plant control
    card_mod: *id001
  - type: entities
    title: Hold room targets
    show_header_toggle: false
    entities:
    - entity: input_boolean.kitchen_manual_ac
      name: Living / kitchen
    - entity: input_boolean.study_manual_ac
      name: Study
    - entity: input_boolean.bed_1_manual_ac
      name: Bedroom 1
    - entity: input_boolean.bed_2_manual_ac
      name: Bedroom 2
    - entity: input_boolean.bed_3_manual_ac
      name: Bedroom 3
    card_mod: *id001
- type: grid
  cards:
  - type: heading
    heading: Demand & airflow
    icon: mdi:air-filter
  - type: markdown
    content: '### Controller signals


      | Signal | Value |

      | :-- | --: |

      | Worst-room demand | {{ (states(''input_number.aircon_weighted_error'') | float | round(2)) if is_number(states(''input_number.aircon_weighted_error''))
      else ''—'' }} K |

      | Temperature trend | {{ (states(''input_number.aircon_avg_deriv'') | float | round(2)) if is_number(states(''input_number.aircon_avg_deriv''))
      else ''—'' }} K |

      | Capacity integral | {{ (states(''input_number.aircon_meta_integral'') | float | round(2)) if is_number(states(''input_number.aircon_meta_integral''))
      else ''—'' }} K |

      | Solar target offset | {{ (states(''input_number.grid_surplus_integral'') | float | round(2)) if is_number(states(''input_number.grid_surplus_integral''))
      else ''—'' }} K |

      | Follow-me temperature | {{ (states(''input_number.fake_temperature'') | float | round(2)) if is_number(states(''input_number.fake_temperature''))
      else ''—'' }} °C |

      '
    card_mod: *id001
  - type: entities
    title: Air path
    show_header_toggle: false
    entities:
    - entity: number.m5atom_static_pressure
      name: Static pressure setting
      type: simple-entity
    - entity: sensor.m5atom_inside_temp
      name: Return temperature
    - entity: sensor.m5atom_inside_coil_inlet_temp
      name: Indoor coil
    - entity: sensor.m5atom_outside_coil_temp
      name: Outdoor coil
    card_mod: *id001
