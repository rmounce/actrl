title: Climate
path: climate-prototype
icon: mdi:home-thermometer-outline
type: sections
max_columns: 3
dense_section_placement: false
sections:
- type: grid
  cards:
  - type: heading
    heading: Whole-house climate
    icon: mdi:home-thermometer-outline
  - type: markdown
    content: '{% set s = states(''sensor.actrl_status'') %}

      {% set age = as_timestamp(now()) - (state_attr(''sensor.actrl_status'',''heartbeat'') | float(0)) %}

      {% set names = {''bed_1'':''Bedroom 1'',''bed_2'':''Bedroom 2'',''bed_3'':''Bedroom 3'',''kitchen'':''Living
      / kitchen'',''study'':''Study''} %}

      {% set lead = state_attr(''sensor.actrl_status'',''lead_room'') %}

      # {{ ''Status overdue'' if age > 90 else {''idle'':''Comfort on standby'',''heating'':''Warming the house'',''cooling'':''Cooling
      the house'',''manual'':''Manual control'',''inhibited'':''Locally inhibited'',''switching'':''Changing mode'',''initializing'':''Starting
      up''}.get(s,''Controller unavailable'') }}

      {% if age > 90 %}Controller heartbeat is over 90 seconds old. Readings may be stale.

      {% elif s == ''idle'' %}No heating or cooling requested right now.

      {% elif s in [''heating'',''cooling''] %}{{ names.get(lead, lead) }} is leading demand.

      {% elif s == ''manual'' %}Automatic control is paused by the manual-mode switch.

      {% elif s == ''inhibited'' %}The unit’s local inhibit is holding automatic control.

      {% endif %}


      {% if age <= 90 and s in [''idle'',''heating'',''cooling''] %}

      **Closest to demand:** {{ names.get(lead, lead) }} · {{ state_attr(''sensor.actrl_status'',''lead_temperature'')
      | round(1, default=0) }}° → {{ state_attr(''sensor.actrl_status'',''lead_target'') | round(1, default=0) }}°

      {% endif %}


      [Detailed diagnostics →](/dashboard-advanced/weather)'
    card_mod: &id001
      style: 'ha-card { border-radius: 18px; box-shadow: none; }'
  - type: entities
    title: Plant · right now
    show_header_toggle: false
    entities:
    - type: attribute
      entity: climate.m5atom_climate
      attribute: hvac_action
      name: Unit activity
    - type: attribute
      entity: climate.m5atom_climate
      attribute: fan_mode
      name: Reported fan speed
    - entity: binary_sensor.m5atom_compressor
      name: Compressor running
    - entity: binary_sensor.m5atom_m5atom_defrost
      name: Defrost reported
    - entity: sensor.m5atom_outside_temp
      name: Outside at unit
    - entity: input_number.aircon_comp_speed
      name: Capacity step · estimated
      type: simple-entity
    - entity: sensor.shellyem_ec64c9c6932b_channel_1_power
      name: Outdoor power
    - entity: sensor.shellyem_ec64c9c6932b_channel_2_power
      name: Indoor power
    card_mod: *id001
  - type: markdown
    content: Capacity is an **estimated step**, not measured compressor speed. Power meters can read slightly below
      zero at standby.
    card_mod: *id001
- type: grid
  cards:
  - type: heading
    heading: Rooms
    icon: mdi:floor-plan
  - type: markdown
    content: '**Temperature first.** Each room shows its measured temperature, requested target band and damper
      opening. Tap a room for setpoints; scheduled targets can change again unless that room is in manual mode.'
    card_mod: *id001
  - type: custom:button-card
    entity: climate.kitchen_aircon
    name: Living / kitchen
    icon: mdi:sofa-outline
    show_state: true
    show_label: true
    state_display: '[[[ const v = states[''sensor.kitchen_average_temperature'']?.state; return v != null && Number.isFinite(Number(v))
      ? Number(v).toFixed(1) + ''°'' : ''—''; ]]]'
    label: '[[[

      const r = "kitchen";

      const val = (id) => states[id]?.state;

      const num = (v) => v !== null && v !== undefined && v !== '''' && Number.isFinite(Number(v)) ? Number(v).toFixed(1)
      : ''—'';

      const a = entity?.attributes || {};

      const manual = val(`input_boolean.${r}_manual_ac`) === ''on'';

      const window = val(`binary_sensor.${r}_window`) === ''on'';

      const turbo = val(`timer.${r}_timed_turbo`) === ''active'';

      const active = val(`timer.${r}_timed_active`) === ''active'';

      const status = entity?.state === ''off'' ? ''Room off'' : manual ? ''Manual targets'' : window ? ''Window
      open'' : turbo ? ''Turbo timer'' : active ? ''Comfort timer'' : ''Scheduled targets'';

      const feels = val(''input_boolean.ac_use_feels_like'') === ''on'';

      const effective = val(`sensor.${r}_${feels ? ''feels_like'' : ''average_temperature''}`);

      return `${status} · ${num(a.target_temp_low)}–${num(a.target_temp_high)}° target<br>${feels ? ''Feels like''
      : ''Measured''} ${num(effective)}° · Damper ${val(`sensor.${r}_damper`) ?? ''—''}%`;

      ]]]'
    triggers_update:
    - sensor.kitchen_average_temperature
    - sensor.kitchen_feels_like
    - sensor.kitchen_damper
    - binary_sensor.kitchen_window
    - input_boolean.kitchen_manual_ac
    - timer.kitchen_timed_active
    - timer.kitchen_timed_turbo
    - input_boolean.ac_use_feels_like
    tap_action:
      action: more-info
    hold_action:
      action: none
    styles:
      card:
      - border-radius: 18px
      - padding: 18px
      - box-shadow: none
      - border-left: '4px solid #169d91'
      grid:
      - grid-template-areas: '"i n s" "l l l"'
      - grid-template-columns: 30px 1fr auto
      - grid-template-rows: 42px auto
      icon:
      - width: 23px
      - color: '#169d91'
      name:
      - justify-self: start
      - font-weight: '600'
      - font-size: 16px
      state:
      - font-size: 30px
      - font-weight: '500'
      label:
      - justify-self: start
      - text-align: left
      - white-space: normal
      - line-height: '1.7'
      - font-size: 13px
      - color: var(--secondary-text-color)
      - padding-top: 8px
